# Configuration Alembic. L'URL de la base n'est pas ici : migrations/env.py la lit dans
# config.settings.DATABASE_URL (variable d'environnement ou .env), comme l'application.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Noms de fichiers triés par révision : 0001_initial.py, 0002_….py
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
